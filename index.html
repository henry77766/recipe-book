<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>食譜本</title>
<meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191512" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="食譜本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E8; --surface:#FFFDF8; --surface-2:#EFE7DA; --ink:#2A231E; --muted:#7B6E62; --faint:#A89A8B; --line:#E4D8C7;
  --accent:#B4472A; --accent-ink:#FFFFFF; --accent-soft:#F6DFD4; --danger:#A3322A; --star:#D3961C;
  --shadow:0 1px 2px rgba(70,45,20,.05),0 6px 18px rgba(70,45,20,.06);
  --r:14px;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191512; --surface:#231E1A; --surface-2:#2E2722; --ink:#F1E8DD; --muted:#A99A8B; --faint:#7D6F62; --line:#3A3129;
    --accent:#E07150; --accent-ink:#1A120E; --accent-soft:#3D2920; --danger:#E3685D; --star:#E6AE45;
    --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
svg{display:block}

/* top bar */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;margin:0 -16px 4px;padding:8px 8px;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top h1{flex:1;margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{width:40px;flex:none}
.icon-btn{width:40px;height:40px;flex:none;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--ink);padding:0}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.sm{width:34px;height:34px;color:var(--muted)}
.icon-btn.sm svg{width:18px;height:18px}
.icon-btn:disabled{opacity:.3}

/* home */
.home-head{padding:22px 0 4px;display:flex;align-items:flex-end;gap:4px}
.home-head .t{flex:1}
.home-head h1{font-family:var(--serif);font-size:32px;line-height:1.2;margin:0;letter-spacing:.06em}
.count{color:var(--muted);font-size:14px}
.search{position:relative;margin:12px 0 6px}
.search input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.rcard{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%;box-shadow:var(--shadow)}
.rcard:active{transform:scale(.99)}
.thumb{flex:none;border-radius:10px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;font-family:var(--serif);color:var(--faint)}
.rcard .thumb{width:78px;height:78px;font-size:30px}
.rcard .body{flex:1;min-width:0;display:block}
.rcard .name{display:block;font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:block;color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 26px 14px 20px;border-radius:999px;box-shadow:0 8px 22px rgba(140,50,20,.28);display:flex;align-items:center;gap:6px;font-size:16px;letter-spacing:.04em}
.fab svg{width:20px;height:20px}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty .big{font-family:var(--serif);font-size:22px;color:var(--ink);margin-bottom:8px}

/* recipe & log */
.hero{margin:0 -16px;position:relative;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--serif);font-size:80px;color:var(--faint)}
img.blur{filter:blur(10px);transform:scale(1.05)}
img.loaded{filter:none;transform:none;transition:filter .35s}
.title-block{padding:16px 0 2px}
.title-block h1{font-family:var(--serif);font-size:28px;line-height:1.3;margin:0 0 6px}
.linkish{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.sec{margin:24px 0}
.sec > h2{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.sec > h2::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.ing-group{font-size:12px;color:var(--faint);margin:6px 0 2px;letter-spacing:.12em}
.ing-group + .ing{border-top:0}
.ing{display:flex;align-items:baseline;gap:8px;padding:6px 0}
.ing .n{flex:none;max-width:60%}
.ing .dots{flex:1;border-bottom:1px dotted var(--faint);opacity:.6;transform:translateY(-4px)}
.ing .a{flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 18px 42px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:14px}
.steps li:not(:last-child)::after{content:"";position:absolute;left:13.5px;top:34px;bottom:6px;width:1px;background:var(--line)}
.steps .act{margin:2px 0 6px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--surface-2);display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15);flex:none}
.note{color:var(--muted);font-size:14px;margin-top:4px}
.callout{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.callout b{color:var(--accent);margin-right:6px}
.badge{display:inline-block;font-size:11px;font-family:var(--sans);font-weight:700;padding:1px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink);margin-left:8px;vertical-align:3px;letter-spacing:.06em}
.lrow{display:flex;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.lrow:last-child{border-bottom:0}
.lrow .thumb{width:54px;height:54px;font-size:20px}
.lrow .body{flex:1;min-width:0;display:flex;flex-direction:column}
.lrow .d{font-weight:600}
.clamp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:none;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:center;background:var(--surface-2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);background:transparent}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.stack{display:flex;flex-direction:column;gap:10px}

/* form */
.field{margin-bottom:14px}
.field > label,.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.in{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none;min-width:0}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:22px}
.in:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea.in{resize:vertical;min-height:76px;line-height:1.5}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.hint .linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;margin-left:4px;font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 62px 78px 34px;gap:6px;margin-bottom:6px;align-items:center}
.irow .in{padding:10px 8px}
.x-btn{border:0;background:transparent;color:var(--faint);width:34px;height:40px;display:grid;place-items:center;border-radius:8px;padding:0}
.x-btn svg{width:18px;height:18px}
.add-btn{border:1.5px dashed var(--line);background:transparent;border-radius:10px;padding:9px 12px;color:var(--muted);font-weight:600;width:100%;margin-top:2px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.scard-head{display:flex;align-items:center;gap:2px;margin-bottom:8px}
.scard-head b{flex:1;font-size:14px;color:var(--accent)}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px;margin-bottom:8px}
.seg button{flex:1;border:0;background:transparent;padding:7px 2px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.time-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.time-row .in{flex:1 1 0;width:auto}
.time-row .in.n{flex:none;width:68px;text-align:center}
.time-row .btn{flex:none;white-space:nowrap;padding:11px 14px}
.time-row > span{flex:none}
.time-row .k{font-size:13px;color:var(--muted);font-weight:600;margin-right:4px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph-tile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.ph-tile img{width:100%;height:100%;object-fit:cover;display:block}
.ph-tile .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;padding:0}
.ph-tile .x svg{width:14px;height:14px}
.ph-tile .cover{position:absolute;left:4px;bottom:4px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:1px 6px;border-radius:6px}
.ph-add{aspect-ratio:1;border:1.5px dashed var(--faint);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:13px;cursor:pointer}
.ph-add svg{width:24px;height:24px}
.ph-add input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.rate{display:flex;gap:2px}
.rate button{border:0;background:transparent;font-size:32px;line-height:1;color:var(--line);padding:2px 3px}
.rate button.on{color:var(--star)}
.banner{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;margin:4px 0 16px}
.banner .callout{margin-top:8px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.savebar .btn{max-width:608px;margin:0 auto;display:flex}

/* lock */
.lock{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:400px;margin:0 auto;padding:24px}
.lock h1{font-family:var(--serif);font-size:42px;margin:0;letter-spacing:.08em}
.lock .sub{color:var(--muted);margin:2px 0 30px}
.err{color:var(--danger);font-size:14px;margin:10px 0 0;min-height:22px}

/* overlays */
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,12,6,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal[hidden],.busy[hidden],.viewer[hidden]{display:none}
.sheet{background:var(--surface);border-radius:18px;padding:20px 18px 18px;width:100%;max-width:420px;margin-bottom:env(safe-area-inset-bottom)}
.sheet p{margin:0 0 18px;font-size:16px}
.sheet-actions{display:flex;gap:10px}
.sheet-actions .btn{flex:1}
.busy{position:fixed;inset:0;z-index:25;background:rgba(20,12,6,.3);display:grid;place-items:center}
.busy-card{background:var(--surface);padding:20px 28px;border-radius:16px;text-align:center;min-width:170px}
.busy-card p{margin:0}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);margin:0 auto 10px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.viewer{position:fixed;inset:0;z-index:30;background:#000;display:grid;place-items:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .icon-btn{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;color:#fff;background:rgba(255,255,255,.12)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden></div>
<div id="viewer" class="viewer" hidden></div>
<div id="busy" class="busy" hidden><div class="busy-card"><div class="spinner"></div><p id="busyText">處理中</p></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<datalist id="dl-recipes"></datalist>
<datalist id="dl-ings"></datalist>
<datalist id="dl-cooks"></datalist>
<script src="config.js"></script>
<script>
(function () {
'use strict';

/* ---------- 固定選項 ---------- */
const COLORS = [
  { k: '未上色', c: '#EFE6D6' }, { k: '淺黃', c: '#EFD48A' }, { k: '金黃', c: '#DCA03A' },
  { k: '焦糖色', c: '#A6602B' }, { k: '深褐', c: '#5A331B' },
];
const STOVES = ['瓦斯爐', '電磁爐', '電鍋', '不加熱'];
const GAS = ['小火', '中小火', '中火', '中大火', '大火'];
const UNITS = ['', '克', '毫升', '小匙', '大匙', '杯', '顆', '個', '片', '根', '把', '瓣', '少許'];
const TAG_SUGGEST = ['便當', '冷吃也好吃', '快速', '常備菜', '宴客'];

/* ---------- 狀態 ---------- */
const $app = document.getElementById('app');
const S = { pass: '', me: '', data: null, loadFailed: false, view: 'lock', params: {}, q: '', tag: '', loadedAt: 0, seq: 0, navCount: 0, lockMsg: '', saving: false };
let F = null;   // 記一筆表單
let E = null;   // 編輯食譜表單
const photoCache = new Map();
const photoPending = new Map();

const store = {
  get(k, d) { try { const v = localStorage.getItem('recipebook:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('recipebook:' + k, JSON.stringify(v)); } catch (e) { /* 空間不足或無法使用時略過 */ } },
  del(k) { try { localStorage.removeItem('recipebook:' + k); } catch (e) { /* 略過 */ } },
};

/* ---------- 圖示 ---------- */
const svg = p => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
const ICON = {
  back: svg('<path d="M15 18l-6-6 6-6"/>'),
  gear: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
  refresh: svg('<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>'),
  edit: svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'),
  x: svg('<path d="M18 6L6 18M6 6l12 12"/>'),
  up: svg('<path d="M18 15l-6-6-6 6"/>'),
  down: svg('<path d="M6 9l6 6 6-6"/>'),
  camera: svg('<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>'),
};

/* ---------- 小工具 ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl2br = s => esc(s).replace(/\n/g, '<br>');
const safeImg = s => (/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(String(s || '')) ? s : '');
const colorOf = k => (COLORS.find(c => c.k === k) || {}).c || 'transparent';
function todayStr() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function fmtDate(s, short) {
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(s || ''));
  if (!m) return esc(s || '');
  const y = +m[1], mo = +m[2], d = +m[3];
  return short && y === new Date().getFullYear() ? mo + '/' + d : y + '/' + mo + '/' + d;
}
function fmtDur(sec) {
  sec = Math.round(Number(sec) || 0);
  if (sec <= 0) return '';
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const out = [];
  if (h) out.push(h + ' 小時');
  if (m) out.push(m + ' 分');
  if (s) out.push(s + ' 秒');
  return out.join(' ');
}
function stars(n) {
  n = Number(n) || 0;
  if (!n) return '';
  let h = '';
  for (let i = 1; i <= 5; i++) h += i <= n ? '★' : '<span class="off">★</span>';
  return '<span class="stars" aria-label="' + n + ' 顆星">' + h + '</span>';
}
function setPath(obj, path, val) {
  const parts = path.split('.');
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) { o = o[parts[i]]; if (o == null) return; }
  o[parts[parts.length - 1]] = val;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
function showBusy(text) { document.getElementById('busyText').textContent = text || '處理中'; document.getElementById('busy').hidden = false; }
function hideBusy() { document.getElementById('busy').hidden = true; }
function ask(msg, okText, danger) {
  return new Promise(resolve => {
    const m = document.getElementById('modal');
    m.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><p>' + esc(msg) + '</p><div class="sheet-actions">' +
      '<button class="btn" data-m="0">取消</button><button class="btn ' + (danger ? 'danger-fill' : 'primary') + '" data-m="1">' + esc(okText || '確定') + '</button></div></div>';
    m.hidden = false;
    m.onclick = e => {
      const b = e.target.closest('[data-m]');
      if (!b && e.target !== m) return;
      m.hidden = true; m.onclick = null; m.innerHTML = '';
      resolve(!!b && b.dataset.m === '1');
    };
  });
}

/* ---------- 和後端溝通 ---------- */
async function call(action, payload) {
  const url = String(window.RECIPEBOOK_API_URL || '').trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) {
    const e = new Error(/\/dev$/.test(url) ? 'config.js 裡的網址要用 /exec 結尾的那一個' : '還沒設定後端網址，請在 config.js 填入 Apps Script 的網址');
    e.code = 'config';
    throw e;
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 90000);
  let text = '';
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ pass: S.pass, action: action, payload: payload || {} }),
      credentials: 'omit',
      redirect: 'follow',
      cache: 'no-store',
      signal: ctrl.signal,
    });
    text = await res.text();
  } catch (err) {
    throw new Error(err && err.name === 'AbortError' ? '等太久沒有回應，請再試一次' : '連線失敗，請檢查網路');
  } finally {
    clearTimeout(timer);
  }
  let data = null;
  try { data = JSON.parse(text); } catch (err) { /* 下面處理 */ }
  if (!data) throw new Error('後端沒有正確回應，請確認 Apps Script 已部署新版本，存取權是「所有人」');
  if (!data.ok) { const e = new Error(data.error || '發生錯誤'); e.code = data.code; throw e; }
  return data;
}

let refreshing = null;
function refresh(manual) {
  if (refreshing) return refreshing;
  refreshing = call('load').then(res => {
    S.data = res.data; S.loadFailed = false; S.loadedAt = Date.now();
    cacheData(); updateDatalists();
    if (S.view === 'home') {
      const a = document.activeElement;
      if (a && a.id === 'q') updateHomeList(); else rerenderKeep();
    } else if (S.view === 'recipe' || S.view === 'log' || S.view === 'settings') {
      rerenderKeep();
    }
    if (manual) toast('已更新');
  }).catch(err => {
    if (err.code === 'auth' || err.code === 'setup' || err.code === 'config') { logoutTo(err.message); return; }
    if (!S.data) { S.loadFailed = true; if (S.view === 'home') rerenderKeep(); }
    if (manual || !S.data) toast(err.message);
  }).finally(() => { refreshing = null; });
  return refreshing;
}
function cacheData() { store.set('data', S.data); }

function getPhoto(id) {
  if (photoCache.has(id)) return Promise.resolve(photoCache.get(id));
  if (photoPending.has(id)) return photoPending.get(id);
  const p = call('getPhoto', { id: id }).then(res => {
    photoCache.set(id, res.dataUrl); photoPending.delete(id); return res.dataUrl;
  }, err => { photoPending.delete(id); throw err; });
  photoPending.set(id, p);
  return p;
}
function hydratePhotos() {
  document.querySelectorAll('img[data-photo]').forEach(img => {
    const id = img.dataset.photo;
    if (!id) return;
    getPhoto(id).then(src => {
      if (!img.isConnected) return;
      img.src = src; img.classList.add('loaded');
    }).catch(() => { /* 照片讀不到就維持縮圖 */ });
  });
}

/* ---------- 資料查詢 ---------- */
function D() { return S.data || { recipes: [], logs: [] }; }
function byDateDesc(a, b) { return (b.date || '').localeCompare(a.date || '') || (b.createdAt || '').localeCompare(a.createdAt || ''); }
function recipeById(id) { return D().recipes.find(r => r.id === id); }
function logById(id) { return D().logs.find(l => l.id === id); }
function logsOf(rid) { return D().logs.filter(l => l.recipeId === rid).sort(byDateDesc); }
function standardOf(r, logs) {
  logs = logs || logsOf(r.id);
  if (r.standardLogId) { const l = logs.find(x => x.id === r.standardLogId); if (l) return { log: l, why: 'set' }; }
  if (!logs.length) return { log: null, why: '' };
  const rated = logs.filter(l => l.rating);
  if (rated.length) return { log: rated.slice().sort((a, b) => (b.rating - a.rating) || byDateDesc(a, b))[0], why: 'best' };
  return { log: logs[0], why: 'latest' };
}
function coverThumb(r, logs) {
  const st = standardOf(r, logs).log;
  if (st && safeImg(st.thumb)) return st.thumb;
  const l = logs.find(x => safeImg(x.thumb));
  return l ? l.thumb : '';
}
function matchRecipe(name) { name = String(name || '').trim(); return name ? D().recipes.find(r => r.name === name) : null; }
function updateDatalists() {
  const d = D();
  const opt = v => '<option value="' + esc(v) + '"></option>';
  document.getElementById('dl-recipes').innerHTML = d.recipes.map(r => opt(r.name)).join('');
  const freq = {};
  d.logs.forEach(l => l.ingredients.forEach(i => { freq[i.name] = (freq[i.name] || 0) + 1; }));
  document.getElementById('dl-ings').innerHTML = Object.keys(freq).sort((a, b) => freq[b] - freq[a]).map(opt).join('');
  const cooks = new Set(d.logs.map(l => l.cook).filter(Boolean));
  if (S.me) cooks.add(S.me);
  document.getElementById('dl-cooks').innerHTML = Array.from(cooks).map(opt).join('');
}

/* ---------- 換頁 ---------- */
const H = {
  push: st => history.pushState(st, ''),
  replace: st => history.replaceState(st, ''),
  setChangeHandler: fn => window.addEventListener('popstate', e => fn({ state: e.state })),
};
function go(view, params, opt) {
  opt = opt || {};
  params = params || {};
  if (H) {
    if (opt.replace) H.replace({ view: view, params: params, seq: S.seq }, {}, '');
    else { S.seq++; H.push({ view: view, params: params, seq: S.seq }, {}, ''); }
  }
  S.view = view; S.params = params;
  render();
  window.scrollTo(0, 0);
}
function back() {
  if (H && S.seq > 0) {
    // 先試瀏覽器的上一頁；如果環境不允許，就直接換到上一層
    const before = S.navCount;
    try { history.back(); } catch (e) { /* 略過 */ }
    setTimeout(() => {
      if (S.navCount === before) { const p = parentOf(S.view, S.params); go(p.view, p.params, { replace: true }); }
    }, 450);
    return;
  }
  const p = parentOf(S.view, S.params);
  go(p.view, p.params, { replace: true });
}
function parentOf(view, params) {
  if (view === 'log') { const l = logById(params.id); return l ? { view: 'recipe', params: { id: l.recipeId } } : { view: 'home' }; }
  if (view === 'form') {
    if (params.edit) return { view: 'log', params: { id: params.edit } };
    if (params.from) { const l = logById(params.from); if (l) return { view: 'recipe', params: { id: l.recipeId } }; }
    return { view: 'home' };
  }
  if (view === 'recipeEdit') return { view: 'recipe', params: { id: params.id } };
  return { view: 'home' };
}
if (H) {
  H.setChangeHandler(e => {
    const st = e && e.state;
    if (!S.pass) return;
    S.navCount++;
    if (S.view === 'form' && F && F.dirty) { clearTimeout(draftTimer); saveDraft(); }
    if (st && st.view) { S.seq = st.seq || 0; S.view = st.view; S.params = st.params || {}; }
    else { S.seq = 0; S.view = 'home'; S.params = {}; }
    render();
    window.scrollTo(0, 0);
  });
}
function rerenderKeep() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function logoutTo(msg) {
  S.pass = ''; store.del('pass'); store.del('data'); S.data = null;
  S.view = 'lock'; S.lockMsg = msg || ''; render();
}

/* ---------- 畫面 ---------- */
function render() {
  let html;
  switch (S.view) {
    case 'lock': html = renderLock(); break;
    case 'recipe': html = renderRecipe(); break;
    case 'log': html = renderLog(); break;
    case 'form': html = renderForm(); break;
    case 'recipeEdit': html = renderRecipeEdit(); break;
    case 'settings': html = renderSettings(); break;
    default: html = renderHome();
  }
  $app.innerHTML = html;
  hydratePhotos();
  // 停在已經被刪掉的頁面時，自動往回跳
  if (S.data && isStale(S.view, S.params)) setTimeout(() => { if (isStale(S.view, S.params)) back(); }, 0);
}
function isStale(view, params) {
  if (view === 'log') return !logById(params.id);
  if (view === 'recipe' || view === 'recipeEdit') return !recipeById(params.id);
  if (view === 'form' && params.edit) return !logById(params.edit);
  return false;
}

function topbar(title, right) {
  return '<div class="top"><button class="icon-btn" data-act="back" aria-label="返回">' + ICON.back + '</button><h1>' + esc(title) + '</h1>' + (right || '<span class="spacer"></span>') + '</div>';
}
function notFound(what) {
  return '<div class="wrap">' + topbar('') + '<div class="empty"><div class="big">找不到' + what + '</div>可能已經被刪除了。<div style="margin-top:18px"><button class="btn" data-act="home">回首頁</button></div></div></div>';
}
function tagsHtml(tags) { return '<div class="tags">' + tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>'; }

/* 登入 */
function renderLock() {
  return '<form class="lock" data-form="login" autocomplete="off">' +
    '<h1>食譜本</h1><div class="sub">兩個人一起寫的料理紀錄</div>' +
    '<div class="field"><label for="l-pass">通關密碼</label><input id="l-pass" class="in" type="password" autocomplete="current-password" placeholder="Code.gs 裡設定的密碼"></div>' +
    '<div class="field"><label for="l-me">你的名字</label><input id="l-me" class="in" value="' + esc(S.me) + '" placeholder="記錄時會預設是你煮的"></div>' +
    '<button class="btn primary block" type="submit" id="l-go">進入</button>' +
    '<div class="err" id="l-err">' + esc(S.lockMsg) + '</div></form>';
}
async function doLogin() {
  const pass = document.getElementById('l-pass').value.trim();
  const me = document.getElementById('l-me').value.trim();
  const err = document.getElementById('l-err');
  if (!pass) { err.textContent = '請輸入通關密碼'; return; }
  const btn = document.getElementById('l-go');
  btn.disabled = true; btn.textContent = '連線中';
  S.pass = pass;
  try {
    const res = await call('load');
    S.data = res.data; S.loadedAt = Date.now(); S.me = me; S.lockMsg = '';
    store.set('pass', pass); store.set('me', me); cacheData(); updateDatalists();
    S.seq = 0;
    go('home', {}, { replace: true });
  } catch (e) {
    S.pass = '';
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = '進入';
  }
}

/* 首頁 */
function renderHome() {
  const d = D();
  const tags = Array.from(new Set(d.recipes.flatMap(r => r.tags)));
  if (S.tag && tags.indexOf(S.tag) === -1) S.tag = '';
  return '<div class="wrap">' +
    '<header class="home-head"><div class="t"><h1>食譜本</h1><div class="count">' +
    (d.recipes.length ? d.recipes.length + ' 道菜 · ' + d.logs.length + ' 筆紀錄' : '還沒有紀錄') + '</div></div>' +
    '<button class="icon-btn" data-act="refresh" aria-label="重新整理">' + ICON.refresh + '</button>' +
    '<button class="icon-btn" data-act="settings" aria-label="設定">' + ICON.gear + '</button></header>' +
    '<div class="search">' + ICON.search + '<input id="q" type="search" enterkeyhint="search" value="' + esc(S.q) + '" placeholder="搜尋菜名、食材、標籤" autocomplete="off"></div>' +
    (tags.length ? '<div class="chips">' + tags.map(t => '<button class="chip' + (S.tag === t ? ' on' : '') + '" data-act="tag" data-v="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div>' : '') +
    '<div id="homeList">' + homeListHtml() + '</div>' +
    '</div><button class="fab" data-act="newLog">' + ICON.plus + '記一筆</button>';
}
function updateHomeList() { const el = document.getElementById('homeList'); if (el) el.innerHTML = homeListHtml(); }
function homeListHtml() {
  const d = D();
  if (!S.data && S.loadFailed) return '<div class="empty"><div class="big">資料載入失敗</div>請確認網路後再試一次。<div style="margin-top:18px"><button class="btn" data-act="refresh">重新載入</button></div></div>';
  if (!S.data) return '<div class="empty">載入中</div>';
  if (!d.recipes.length) return '<div class="empty"><div class="big">從第一道菜開始</div>按下方「記一筆」，先拍張成品照、寫下菜名就能存，其他細節之後再補。</div>';
  const terms = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let items = d.recipes.map(r => { const logs = logsOf(r.id); return { r: r, logs: logs, last: logs[0] }; });
  if (S.tag) items = items.filter(o => o.r.tags.indexOf(S.tag) !== -1);
  if (terms.length) {
    items = items.filter(o => {
      const hay = [o.r.name, o.r.tags.join(' '), o.r.notes || '', o.logs.map(l => l.ingredients.map(i => i.name).join(' ')).join(' ')].join(' ').toLowerCase();
      return terms.every(t => hay.indexOf(t) !== -1);
    });
  }
  items.sort((a, b) => ((b.last && b.last.date) || '').localeCompare((a.last && a.last.date) || ''));
  if (!items.length) return '<div class="empty"><div class="big">找不到符合的菜</div>換個關鍵字試試，也可以搜尋食材名稱。</div>';
  return '<div class="list">' + items.map(o => cardHtml(o, terms)).join('') + '</div>';
}
function cardHtml(o, terms) {
  const th = coverThumb(o.r, o.logs);
  const st = standardOf(o.r, o.logs).log;
  let hit = '';
  if (terms.length) {
    const names = Array.from(new Set(o.logs.flatMap(l => l.ingredients.map(i => i.name))))
      .filter(n => terms.some(t => n.toLowerCase().indexOf(t) !== -1));
    if (names.length) hit = '<span class="meta">用到 ' + esc(names.slice(0, 3).join('、')) + '</span>';
  }
  return '<button class="rcard" data-act="openRecipe" data-id="' + esc(o.r.id) + '">' +
    (th ? '<img class="thumb" src="' + th + '" alt="">' : '<span class="thumb">' + esc(o.r.name.slice(0, 1)) + '</span>') +
    '<span class="body"><span class="name">' + esc(o.r.name) + '</span>' +
    '<span class="meta">煮過 ' + o.logs.length + ' 次' + (o.last ? ' · 最近 ' + fmtDate(o.last.date, true) : '') + (st && st.rating ? ' ' + stars(st.rating) : '') + '</span>' +
    hit + (o.r.tags.length ? tagsHtml(o.r.tags) : '') + '</span></button>';
}

/* 一道菜 */
function renderRecipe() {
  const r = recipeById(S.params.id);
  if (!r) return notFound('這道菜');
  const logs = logsOf(r.id);
  const std = standardOf(r, logs);
  const st = std.log;
  const whyText = std.why === 'set' ? '標準版本' : (std.why === 'best' ? '評分最高的一次' : '最近一次');
  const first = st && st.photoIds[0];
  let h = '<div class="wrap">' + topbar(r.name, '<button class="icon-btn" data-act="editRecipe" data-id="' + esc(r.id) + '" aria-label="編輯這道菜">' + ICON.edit + '</button>');
  h += '<div class="hero">' + (first
    ? '<img data-photo="' + esc(first) + '" data-act="viewPhoto"' + (safeImg(st.thumb) ? ' src="' + st.thumb + '" class="blur"' : '') + ' alt="">'
    : '<div class="ph">' + esc(r.name.slice(0, 1)) + '</div>') + '</div>';
  h += '<div class="title-block"><h1>' + esc(r.name) + '</h1><span class="meta">煮過 ' + logs.length + ' 次' + (r.servings ? ' · ' + esc(r.servings) : '') + '</span>' +
    (r.tags.length ? tagsHtml(r.tags) : '') + (r.notes ? '<div class="note" style="margin-top:8px">' + nl2br(r.notes) + '</div>' : '') + '</div>';
  if (st) {
    h += '<div class="sec"><h2>做法</h2><span class="meta" style="margin:-4px 0 12px">依據 ' + fmtDate(st.date) + (st.cook ? ' · ' + esc(st.cook) + ' 煮的' : '') + '，' + whyText + ' ' + stars(st.rating) + '</span>';
    if (st.adjust) h += '<div class="callout" style="margin-bottom:14px"><b>下次要調整</b>' + nl2br(st.adjust) + '</div>';
    h += recipeBody(st);
    h += '<button class="btn primary block" data-act="cookAgain" data-id="' + esc(st.id) + '" style="margin-top:10px">照這個再煮一次</button></div>';
  }
  h += '<div class="sec"><h2>煮過的紀錄</h2>' + logs.map(l => logRow(l, r)).join('') + '</div></div>';
  return h;
}
function recipeBody(l) {
  const ings = l.ingredients.filter(i => i.type !== '調味料');
  const seas = l.ingredients.filter(i => i.type === '調味料');
  const ingList = arr => arr.map(i => '<div class="ing"><span class="n">' + esc(i.name) + '</span><span class="dots"></span><span class="a">' + esc([i.amount, i.unit].filter(Boolean).join(' ')) + '</span></div>').join('');
  let h = '';
  if (ings.length || seas.length) {
    h += '<div class="card" style="margin-bottom:16px">' +
      (ings.length ? '<div class="ing-group">食材</div>' + ingList(ings) : '') +
      (seas.length ? '<div class="ing-group"' + (ings.length ? ' style="margin-top:12px"' : '') + '>調味料</div>' + ingList(seas) : '') + '</div>';
  }
  if (l.steps.length) {
    h += '<ol class="steps">' + l.steps.map(s => '<li><div class="act">' + (s.action ? nl2br(s.action) : '<span class="note">沒有寫動作</span>') + '</div>' + stepPills(s) +
      (s.note ? '<div class="note">' + esc(s.note) + '</div>' : '') + '</li>').join('') + '</ol>';
  }
  const times = [];
  if (l.cookSec) times.push('烹煮 ' + fmtDur(l.cookSec));
  if (l.spentMin) times.push('總共花了 ' + fmtDur(l.spentMin * 60));
  if (times.length) h += '<span class="meta">' + times.join(' · ') + '</span>';
  if (!h) h = '<div class="note">這次只記了菜名' + (l.photoIds.length ? '和照片' : '') + '，下次煮的時候可以補上材料和步驟。</div>';
  return h;
}
function stepPills(s) {
  const p = [];
  if (s.stove && s.stove !== '不加熱') p.push('<span class="pill">' + esc(s.stove) + (s.heat ? ' · ' + esc(s.heat) : '') + '</span>');
  if (s.sec) p.push('<span class="pill">' + fmtDur(s.sec) + '</span>');
  if (s.color) p.push('<span class="pill"><span class="sw" style="background:' + colorOf(s.color) + '"></span>' + esc(s.color) + '</span>');
  return p.length ? '<div class="pills">' + p.join('') + '</div>' : '';
}
function logRow(l, r) {
  return '<button class="lrow" data-act="openLog" data-id="' + esc(l.id) + '">' +
    (safeImg(l.thumb) ? '<img class="thumb" src="' + l.thumb + '" alt="">' : '<span class="thumb">' + esc((l.cook || '·').slice(0, 1)) + '</span>') +
    '<span class="body"><span class="d">' + fmtDate(l.date) + (r.standardLogId === l.id ? '<span class="badge">標準</span>' : '') + '</span>' +
    '<span class="meta">' + esc(l.cook || '') + (l.cook && l.rating ? ' · ' : '') + stars(l.rating) + '</span>' +
    (l.thoughts ? '<span class="meta clamp">' + esc(l.thoughts) + '</span>' : '') + '</span></button>';
}

/* 單次紀錄 */
function renderLog() {
  const l = logById(S.params.id);
  if (!l) return notFound('這筆紀錄');
  const r = recipeById(l.recipeId) || { id: '', name: '', standardLogId: '' };

async function handleFiles(list) {
  const files = Array.from(list || []);
  if (!files.length || !F) return;

  for (const file of files) {
    try {

      const thumb = await makeThumb(full);
      F.photos.push({ dataUrl: full, thumb: thumb });
    } catch (e) { fail++; }
  }

  if (fail) toast(fail + ' 張照片讀取失敗，換一張試試');
}
function loadImg(src) {
  return new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = () => reject(new Error('img')); img.src = src; });
}
function readAsDataURL(file) {
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(file); });
}
async function resizeFile(file, max, q) {
  let url = null;
  try {
    url = URL.createObjectURL(file);
    return drawScaled(await loadImg(url), max, q);
  } catch (e) {
    return drawScaled(await loadImg(await readAsDataURL(file)), max, q);
  } finally {
    if (url) URL.revokeObjectURL(url);
  }
}
function drawScaled(img, max, q) {
  const w0 = img.naturalWidth, h0 = img.naturalHeight;
  if (!w0 || !h0) throw new Error('empty');
  const s = Math.min(1, max / Math.max(w0, h0));
  const w = Math.round(w0 * s), h = Math.round(h0 * s);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', q);
}
async function makeThumb(src) {
  const img = await loadImg(src);
  let size = 240, q = 0.72, out = '';
  for (let k = 0; k < 5; k++) {
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    const sx = (img.naturalWidth - side) / 2, sy = (img.naturalHeight - side) / 2;
    const c = document.createElement('canvas'); c.width = size; c.height = size;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
    ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
    out = c.toDataURL('image/jpeg', q);
    if (out.length < 40000) return out;
    size = Math.round(size * 0.8); q = Math.max(0.4, q - 0.08);
  }
  return out.length < 45000 ? out : '';
}

async function saveForm() {
  if (S.saving || !F) return;
  const name = F.recipeName.trim();
  if (!name) {
    toast('請先填菜名');
    const el = document.getElementById('f-name');
    if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); }
    return;
  }
  S.saving = true;
  try {
    const pending = F.photos.filter(p => !p.id);
    let n = 0;
    for (const p of F.photos) {
      if (p.id) continue;
      n++;
      showBusy('上傳照片 ' + n + '/' + pending.length);
      const res = await call('uploadPhoto', { dataUrl: p.dataUrl, label: name });
      p.id = res.id;
      photoCache.set(res.id, p.dataUrl);
    }
    showBusy('儲存中');
    let thumb = '';
    const first = F.photos[0];
    if (first) {
      thumb = safeImg(first.thumb);
      if (!thumb) {
        try { thumb = await makeThumb(first.dataUrl || await getPhoto(first.id)); } catch (e) { thumb = ''; }
        first.thumb = thumb;
      }
    }
    const cm = parseFloat(F.cookMin);
    const sm = parseFloat(F.spentMin);
    const payload = {
      log: {
        id: F.logId, recipeName: name, tags: F.tags, date: F.date || todayStr(), cook: F.cook.trim(),
        cookSec: !isNaN(cm) && cm > 0 ? Math.round(cm * 60) : (stepSum(F.steps) || ''),
        spentMin: !isNaN(sm) && sm > 0 ? sm : '', rating: F.rating || '',
        thoughts: F.thoughts.trim(), adjust: F.adjust.trim(), photoIds: F.photos.map(p => p.id), thumb: thumb,
      },
      ingredients: F.ingredients.map(i => ({ type: i.type, name: String(i.name || '').trim(), amount: String(i.amount || '').trim(), unit: i.unit || '' })),
      steps: F.steps.map(s => ({ action: String(s.action || '').trim(), stove: s.stove, heat: String(s.heat || '').trim(), sec: stepSec(s), color: s.color, note: String(s.note || '').trim() })),
    };
    const res = await call('saveLog', payload);
    S.data = res.data; S.loadedAt = Date.now();
    cacheData();
    store.del(draftKey(F));
    if (!S.me && payload.log.cook) { S.me = payload.log.cook; store.set('me', S.me); }
    updateDatalists();
    const wasEdit = !!F.logId;
    F = null;
    hideBusy();
    toast('已儲存');
    // 編輯：回到原本那筆紀錄的頁面；新增：用紀錄頁取代表單
    if (wasEdit && H && S.seq > 0) back();
    else go('log', { id: res.logId }, { replace: true });
  } catch (err) {
    hideBusy();
    if (err.code === 'auth' || err.code === 'setup' || err.code === 'config') { saveDraft(); logoutTo(err.message); }
    else toast('儲存失敗：' + err.message);
  } finally {
    S.saving = false;
  }
}

    '<div class="field"><label for="e-name">菜名</label><input id="e-name" class="in" data-ebind="name" value="' + esc(E.name) + '"><div class="hint">改名後，所有紀錄都會跟著這道菜</div></div>' +
    '<div class="field"><label for="e-serv">份量</label><input id="e-serv" class="in" data-ebind="servings" value="' + esc(E.servings) + '" placeholder="例如：2 人份、4 個便當"></div>' +
    '<div class="field"><label for="e-notes">備註</label><textarea id="e-notes" class="in" data-ebind="notes" placeholder="這道菜的小故事、適合搭配什麼">' + esc(E.notes) + '</textarea></div>' +
    '<div class="field"><span class="lbl">標籤</span><div class="opts">' + allTags.map(t => '<button type="button" class="opt' + (E.tags.indexOf(t) !== -1 ? ' on' : '') + '" data-act="eToggleTag" data-v="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div>' +
    '<div class="time-row"><input id="eNewTag" class="in" placeholder="自訂標籤"><button type="button" class="btn" data-act="eAddTag">加入</button></div></div>' +
    '</div><div class="savebar"><button class="btn primary block" data-act="saveRecipe">儲存</button></div>';
}

/* 設定 */
function renderSettings() {
  const d = D();
  return '<div class="wrap">' + topbar('設定') +
    '<div class="sec"><h2>你的名字</h2><div class="time-row"><input id="s-me" class="in" value="' + esc(S.me) + '" placeholder="記錄時預設是誰煮的"><button class="btn" data-act="saveMe">儲存</button></div><div class="hint">只存在這支手機上</div></div>' +
    '<div class="sec"><h2>資料放在哪裡</h2><div class="card">所有紀錄和照片都存在你的 Google 試算表裡，照片放在隱藏的「照片」工作表。試算表可以直接打開查看或手動修改，照片那一頁請不要動。' +
    (d.sheetUrl ? '<div style="margin-top:12px"><a class="btn block" href="' + esc(d.sheetUrl) + '" target="_blank" rel="noopener">打開試算表</a></div>' : '') + '</div></div>' +
    '<div class="sec"><h2>加到手機主畫面</h2><div class="card"><b>iPhone</b>　用 Safari 打開這個網址，點下方分享按鈕，選「加入主畫面」。<div style="height:8px"></div><b>Android</b>　用 Chrome 打開這個網址，點右上角選單，選「加到主畫面」或「安裝應用程式」。</div></div>' +
    '<div class="sec stack"><button class="btn block" data-act="refresh">重新載入資料</button><button class="btn block danger" data-act="logout">這支手機登出</button></div>' +
    '<div class="meta" style="text-align:center">食譜本 第二版</div></div>';
}

/* ---------- 事件 ---------- */
const ACT = {
  back: () => back(),
  home: () => go('home', {}, { replace: true }),
  settings: () => go('settings'),
  refresh: () => refresh(true),
  tag: el => { S.tag = S.tag === el.dataset.v ? '' : el.dataset.v; rerenderKeep(); },
  openRecipe: el => { if (el.dataset.id) go('recipe', { id: el.dataset.id }); },
  openLog: el => go('log', { id: el.dataset.id }),
  newLog: () => openForm({}),
  cookAgain: el => openForm({ from: el.dataset.id }),
  editLog: el => openForm({ edit: el.dataset.id }),
  editRecipe: el => { E = null; go('recipeEdit', { id: el.dataset.id }); },
  viewPhoto: el => {
    const v = document.getElementById('viewer');
    const id = el.dataset.photo;
    v.innerHTML = '<img alt=""><button class="icon-btn" aria-label="關閉">' + ICON.x + '</button>';
    const img = v.querySelector('img');
    img.src = (id && photoCache.get(id)) || el.src || '';
    if (id && !photoCache.has(id)) getPhoto(id).then(src => { img.src = src; }).catch(() => {});
    v.hidden = false;
    v.onclick = () => { v.hidden = true; v.innerHTML = ''; v.onclick = null; };
  },
  setStandard: async el => {
    const l = logById(el.dataset.id);
    if (!l) return;
    showBusy('儲存中');
    try { const res = await call('setStandard', { recipeId: l.recipeId, logId: l.id }); S.data = res.data; cacheData(); hideBusy(); rerenderKeep(); toast('已設為標準版本'); }
    catch (e) { hideBusy(); toast(e.message); }
  },
  deleteLog: async el => {
    const ok = await ask('確定要刪除這筆紀錄？這次的照片也會一起刪除，刪除後無法復原。', '刪除', true);
    if (!ok) return;
    const l = logById(el.dataset.id);
    showBusy('刪除中');
    try {
      const res = await call('deleteLog', { id: el.dataset.id });
      S.data = res.data; cacheData(); updateDatalists(); hideBusy(); toast('已刪除');
      if (H && S.seq > 0) { back(); return; }
      const stillThere = l && recipeById(l.recipeId);
      if (stillThere) go('recipe', { id: l.recipeId }, { replace: true }); else go('home', {}, { replace: true });
    } catch (e) { hideBusy(); toast(e.message); }
  },
  // 記一筆
  formCancel: async () => {
    if (F && F.dirty && formHasContent(F)) {
      const ok = await ask(F.logId ? '放棄這次的修改？' : '放棄這筆紀錄？', '放棄', true);
      if (!ok) return;
    }
    if (F) store.del(draftKey(F));
    clearTimeout(draftTimer);
    F = null;
    back();
  },
  prefillFrom: el => {
    const base = logById(el.dataset.id);
    if (!base || !F) return;
    const keep = { key: F.key, recipeName: F.recipeName, date: F.date, cook: F.cook, photos: F.photos, rating: F.rating, thoughts: F.thoughts, adjust: F.adjust, spentMin: F.spentMin };
    F = Object.assign(buildForm({ from: base.id }), keep);
    formChanged();
    toast('已帶入上次的做法');
  },
  addIng: el => {
    F.ingredients.push(blankIng(el.dataset.type));
    formChanged();
    const inp = document.querySelector('[data-bind="ingredients.' + (F.ingredients.length - 1) + '.name"]');
    if (inp) inp.focus();
  },
  delIng: el => { F.ingredients.splice(+el.dataset.i, 1); formChanged(); },
  addStep: () => {
    const last = F.steps[F.steps.length - 1];
    F.steps.push(blankStep(last ? last.stove : ''));
    formChanged();
    const inp = document.querySelector('[data-bind="steps.' + (F.steps.length - 1) + '.action"]');
    if (inp) inp.focus();
  },
  delStep: el => { F.steps.splice(+el.dataset.i, 1); if (!F.steps.length) F.steps.push(blankStep()); formChanged(); },
  moveStep: el => {
    const i = +el.dataset.i, j = i + (+el.dataset.d);
    if (j < 0 || j >= F.steps.length) return;
    const t = F.steps[i]; F.steps[i] = F.steps[j]; F.steps[j] = t;
    formChanged();
  },
  setStove: el => { const s = F.steps[+el.dataset.i]; if (s.stove !== el.dataset.v) { s.stove = el.dataset.v; s.heat = ''; } formChanged(); },
  setHeat: el => { const s = F.steps[+el.dataset.i]; s.heat = s.heat === el.dataset.v ? '' : el.dataset.v; formChanged(); },
  setColor: el => { const s = F.steps[+el.dataset.i]; s.color = s.color === el.dataset.v ? '' : el.dataset.v; formChanged(); },
  rate: el => { const n = +el.dataset.n; F.rating = F.rating === n ? 0 : n; formChanged(); },
  toggleTag: el => { const t = el.dataset.v; const i = F.tags.indexOf(t); if (i === -1) F.tags.push(t); else F.tags.splice(i, 1); formChanged(); },
  addTag: () => {
    const inp = document.getElementById('newTag');
    const t = inp.value.trim().replace(/[、,，]/g, '');
    if (t && F.tags.indexOf(t) === -1) F.tags.push(t);
    formChanged();
  },
  delPhoto: el => { F.photos.splice(+el.dataset.i, 1); formChanged(); },
  coverPhoto: el => {
    const i = +el.dataset.i;
    if (i > 0) { const p = F.photos.splice(i, 1)[0]; F.photos.unshift(p); formChanged(); }
  },
  saveForm: () => saveForm(),
  // 編輯食譜
  eToggleTag: el => { const t = el.dataset.v; const i = E.tags.indexOf(t); if (i === -1) E.tags.push(t); else E.tags.splice(i, 1); rerenderKeep(); },
  eAddTag: () => {
    const inp = document.getElementById('eNewTag');
    const t = inp.value.trim().replace(/[、,，]/g, '');
    if (t && E.tags.indexOf(t) === -1) E.tags.push(t);
    rerenderKeep();
  },
  saveRecipe: async () => {
    if (!E || !E.name.trim()) { toast('請填寫菜名'); return; }
    showBusy('儲存中');
    try {
      const res = await call('saveRecipe', { id: E.id, name: E.name.trim(), tags: E.tags, servings: E.servings.trim(), notes: E.notes.trim() });
      S.data = res.data; cacheData(); updateDatalists(); hideBusy(); E = null; toast('已儲存'); back();
    } catch (e) { hideBusy(); toast(e.message); }
  },
  // 設定
  saveMe: () => { S.me = document.getElementById('s-me').value.trim(); store.set('me', S.me); updateDatalists(); toast('已儲存'); },
  logout: async () => {
    const ok = await ask('這支手機要登出嗎？資料不會被刪除，下次輸入通關密碼就能再看到。', '登出', true);
    if (ok) logoutTo('');
  },
};

$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !$app.contains(el) || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
$app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'login') doLogin();
});
$app.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { S.q = el.value; updateHomeList(); return; }
  if (el.dataset.ebind && E) { E[el.dataset.ebind] = el.value; return; }
  const path = el.dataset.bind;
  if (!path || !F) return;
  setPath(F, path, el.value);
  F.dirty = true;
  if (path === 'recipeName') { const h = document.getElementById('nameHint'); if (h) h.innerHTML = nameHint(); }
  if (/^steps\.\d+\.(min|sec)$/.test(path)) {
    const h = document.getElementById('sumHint'); if (h) h.textContent = sumHint();
    const cm = document.getElementById('f-cookmin'); if (cm) cm.placeholder = stepSum(F.steps) ? String(Math.round(stepSum(F.steps) / 6) / 10) : '';
  }
  saveDraftSoon();
});
$app.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.files) { handleFiles(el.files); el.value = ''; return; }
  if (el.tagName === 'SELECT' && el.dataset.bind && F) { setPath(F, el.dataset.bind, el.value); F.dirty = true; saveDraftSoon(); }
});
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'newTag') { e.preventDefault(); ACT.addTag(); }
  if (e.target.id === 'eNewTag') { e.preventDefault(); ACT.eAddTag(); }
  if (e.target.id === 'q') e.target.blur();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && S.view === 'form' && F && F.dirty) { clearTimeout(draftTimer); saveDraft(); }
  if (document.visibilityState === 'visible' && S.pass && Date.now() - S.loadedAt > 60000) refresh(false);
});

/* ---------- 啟動 ---------- */
function boot() {
  S.pass = store.get('pass', '');
  S.me = store.get('me', '');
  if (H) H.replace({ view: 'home', params: {}, seq: 0 }, {}, '');
  if (!S.pass) { S.view = 'lock'; render(); return; }
  S.data = store.get('data', null);
  S.view = 'home'; S.params = {};
  render();
  updateDatalists();
  refresh(false);
}
boot();

/* ---------- 安裝成 APP 與離線開啟 ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* 不支援時照常使用 */ }); });
}
})();
</script>
</body>
</html>
